<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청약 정보 알리미</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-900 mb-6">🏠 실시간 청약 정보</h1>
        
        <!-- 탭 메뉴 -->
        <div class="flex space-x-2 mb-6 bg-white p-1 rounded-lg shadow-sm border border-gray-200">
            <button onclick="render('RUNNING')" class="flex-1 py-2 font-semibold text-blue-600 bg-blue-50 rounded-md">진행 중</button>
            <button onclick="render('PLANNED')" class="flex-1 py-2 font-semibold text-gray-600 hover:bg-gray-50 rounded-md">청약 예정</button>
            <button onclick="render('FINISHED')" class="flex-1 py-2 font-semibold text-gray-600 hover:bg-gray-50 rounded-md">결과 발표</button>
        </div>

        <!-- 리스트 영역 -->
        <div id="list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <p class="text-gray-500">데이터를 불러오는 중입니다...</p>
        </div>
    </div>

    <script>
        const API_KEY = "73d2e59ef152e8b86188255ac343a5d161f4327d8aa00f0daa8a94c86681589f";
        const URL = `https://api.odcloud.kr/api/ApplyhomeInfo/v1/getAptList?serviceKey=${API_KEY}&page=1&perPage=50`;
        
        let allData = [];

        async function fetchData() {
            try {
                const res = await fetch(URL);
                const json = await res.json();
                allData = json.data;
                render('RUNNING');
            } catch (e) {
                document.getElementById('list').innerHTML = `<p class="text-red-500">데이터를 불러오지 못했습니다. API 키를 확인해주세요.</p>`;
            }
        }

        function render(status) {
            const list = document.getElementById('list');
            const today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            list.innerHTML = "";

            const filtered = allData.filter(item => {
                const start = item.rceptBgnde; // YYYYMMDD
                const end = item.rceptEndde;
                if (status === 'RUNNING') return start <= today && today <= end;
                if (status === 'PLANNED') return start > today;
                if (status === 'FINISHED') return end < today;
            });

            filtered.forEach(item => {
                const link = "https://www.applyhome.co.kr"; // 실제 상세 페이지로 연결하려면 API의 상세 코드 필요
                list.innerHTML += `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                        <h2 class="font-bold text-lg mb-1">${item.houseNm}</h2>
                        <p class="text-sm text-gray-600 mb-2">${item.hssplyAdres}</p>
                        <div class="flex justify-between items-center mt-4">
                            <span class="text-xs text-gray-400">${item.rceptBgnde} ~ ${item.rceptEndde}</span>
                            <a href="${link}" target="_blank" class="bg-blue-600 text-white text-xs px-3 py-1 rounded-full hover:bg-blue-700">바로가기</a>
                        </div>
                    </div>
                `;
            });
        }
        fetchData();
    </script>
</body>
</html>
