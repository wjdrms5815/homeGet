<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청약 통합 분석 및 자격 진단 플랫폼</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8 text-gray-800">
    <div class="max-w-5xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="bg-blue-600 text-white p-6 rounded-2xl shadow-md">
            <h1 class="text-2xl font-bold">🏠 맞춤형 청약 진단 및 실시간 공고 플랫폼</h1>
            <p class="text-blue-100 text-sm mt-1">내 자격을 입력하고 실시간 청약 공고와 예상 경쟁률을 한눈에 확인하세요.</p>
        </header>

        <!-- 사용자 자격 입력 섹션 -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold mb-4 text-gray-900">📝 내 청약 자격 진단 설정</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">나이</label>
                    <input type="number" id="userAge" value="28" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">주택 소유 여부</label>
                    <select id="userHousing" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="none">무주택자</option>
                        <option value="has">유주택자</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">청약통장 가입 기간 (개월)</label>
                    <input type="number" id="userSavingsMonths" value="26" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">연소득 (만원)</label>
                    <input type="number" id="userIncome" value="4500" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>
            <button onclick="updateAnalysis()" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition text-sm">
                맞춤형 자격 및 추천 반영하기
            </button>
        </section>

        <!-- 탭 및 필터 메뉴 -->
        <div class="flex space-x-2 bg-white p-1.5 rounded-xl shadow-sm border border-gray-200">
            <button onclick="switchTab('RUNNING')" id="btnRunning" class="flex-1 py-2 font-semibold text-blue-600 bg-blue-50 rounded-lg text-sm transition">진행 중</button>
            <button onclick="switchTab('PLANNED')" id="btnPlanned" class="flex-1 py-2 font-semibold text-gray-600 hover:bg-gray-50 rounded-lg text-sm transition">청약 예정</button>
            <button onclick="switchTab('FINISHED')" id="btnFinished" class="flex-1 py-2 font-semibold text-gray-600 hover:bg-gray-50 rounded-lg text-sm transition">결과 발표</button>
        </div>

        <!-- 리스트 출력 영역 -->
        <div id="listContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="col-span-full bg-white p-8 rounded-2xl text-center text-gray-500 shadow-sm border border-gray-100">
                데이터를 불러오는 중입니다...
            </div>
        </div>

    </div>

    <script>
        const API_KEY = "73d2e59ef152e8b86188255ac343a5d161f4327d8aa00f0daa8a94c86681589f";
        const URL = `https://api.odcloud.kr/api/ApplyhomeInfo/v1/getAptList?serviceKey=${API_KEY}&page=1&perPage=50`;
        
        let allData = [];
        let currentStatus = 'RUNNING';

        async function fetchData() {
            try {
                const res = await fetch(URL);
                const json = await res.json();
                allData = json.data || [];
                render();
            } catch (e) {
                document.getElementById('listContainer').innerHTML = `
                    <div class="col-span-full bg-red-50 text-red-600 p-6 rounded-2xl text-center border border-red-200 text-sm">
                        데이터를 불러오지 못했습니다. API 인증키 상태를 확인해주세요.
                    </div>
                `;
            }
        }

        function switchTab(status) {
            currentStatus = status;
            ['RUNNING', 'PLANNED', 'FINISHED'].forEach(s => {
                const btn = document.getElementById('btn' + s.charAt(0) + s.slice(1).toLowerCase());
                if(s === status) {
                    btn.className = "flex-1 py-2 font-semibold text-blue-600 bg-blue-50 rounded-lg text-sm transition";
                } else {
                    btn.className = "flex-1 py-2 font-semibold text-gray-600 hover:bg-gray-50 rounded-lg text-sm transition";
                }
            });
            render();
        }

        function updateAnalysis() {
            render();
        }

        function render() {
            const container = document.getElementById('listContainer');
            const today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            
            // 사용자 입력 값 가져오기
            const savings = parseInt(document.getElementById('userSavingsMonths').value) || 0;
            const housing = document.getElementById('userHousing').value;
            
            container.innerHTML = "";

            const filtered = allData.filter(item => {
                const start = item.rceptBgnde || '';
                const end = item.rceptEndde || '';
                if (currentStatus === 'RUNNING') return start <= today && today <= end;
                if (currentStatus === 'PLANNED') return start > today;
                if (currentStatus === 'FINISHED') return end < today;
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full bg-white p-8 rounded-2xl text-center text-gray-500 shadow-sm border border-gray-100 text-sm">
                        해당 조건에 일치하는 청약 공고가 없습니다.
                    </div>
                `;
                return;
            }

            filtered.forEach((item, index) => {
                // 자격 적합도 판정 로직
                let eligibilityTag = "";
                if (savings < 6) {
                    eligibilityTag = `<span class="bg-red-100 text-red-700 text-xs px-2.5 py-1 rounded-md font-medium">통장 가입기간 부족 (6개월 미만)</span>`;
                } else if (housing === 'has') {
                    eligibilityTag = `<span class="bg-yellow-100 text-yellow-700 text-xs px-2.5 py-1 rounded-md font-medium">유주택자 (추첨제 공급 확인 필요)</span>`;
                } else {
                    eligibilityTag = `<span class="bg-green-100 text-green-700 text-xs px-2.5 py-1 rounded-md font-medium">1순위 청약 가능성 높음</span>`;
                }

                // 참고용 유사 단지 경쟁률 계산 시뮬레이션
                const mockCompRate = (15 + (index * 5.2) % 60).toFixed(1);

                container.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col justify-between space-y-4">
                        <div>
                            <div class="flex justify-between items-start mb-2 gap-2">
                                <h2 class="font-bold text-base text-gray-900">${item.houseNm || '정보 없음'}</h2>
                                ${eligibilityTag}
                            </div>
                            <p class="text-xs text-gray-500 mb-3">${item.hssplyAdres || '주소 정보 없음'}</p>
                            <div class="bg-gray-50 p-3 rounded-xl space-y-1.5 text-xs text-gray-600">
                                <div class="flex justify-between">
                                    <span class="text-gray-400">접수 기간</span>
                                    <span class="font-medium">${item.rceptBgnde || '-'} ~ ${item.rceptEndde || '-'}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-400">유사 단지 참고 경쟁률</span>
                                    <span class="font-semibold text-blue-600">약 ${mockCompRate} : 1</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex justify-between items-center pt-2 border-t border-gray-50">
                            <span class="text-xs text-gray-400">총 공급세대: ${item.totSuplyHshldco || '-'}세대</span>
                            <a href="https://www.applyhome.co.kr" target="_blank" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">
                                청약홈 공지 이동
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        fetchData();
    </script>
</body>
</html>
