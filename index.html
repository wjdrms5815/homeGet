<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청약 통합 분석 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8 text-gray-800">
    <div class="max-w-5xl mx-auto space-y-6">
        <header class="bg-blue-600 text-white p-6 rounded-2xl shadow-md">
            <h1 class="text-2xl font-bold">🏠 맞춤형 청약 진단 및 실시간 공고 플랫폼</h1>
            <p class="text-blue-100 text-sm mt-1">내 자격을 입력하고 실시간 청약 공고를 확인하세요.</p>
        </header>

        <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold mb-4 text-gray-900">📝 내 청약 자격 진단 설정</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="number" id="userAge" placeholder="나이" value="28" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
                <select id="userHousing" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
                    <option value="none">무주택자</option>
                    <option value="has">유주택자</option>
                </select>
                <input type="number" id="userSavingsMonths" placeholder="통장 가입기간(개월)" value="26" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
                <input type="number" id="userIncome" placeholder="연소득(만원)" value="4500" class="w-full border border-gray-300 rounded-lg p-2 text-sm">
            </div>
            <button onclick="render()" class="mt-4 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition text-sm">진단 및 업데이트</button>
        </section>

        <div id="listContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="col-span-full text-center p-10 text-gray-500">데이터를 불러오는 중입니다...</div>
        </div>
    </div>

    <script>
        const API_KEY = "73d2e59ef152e8b86188255ac343a5d161f4327d8aa00f0daa8a94c86681589f";
        // 정상 작동하는 URL로 수정 완료
        const URL = `https://api.odcloud.kr/api/ApplyhomeInfoDetailSvc/v1/getAPTLttotPblancDetail?serviceKey=${API_KEY}&page=1&perPage=50`;
        
        let allData = [];

        async function fetchData() {
            try {
                const res = await fetch(URL);
                const json = await res.json();
                allData = json.data || [];
                render();
            } catch (e) {
                console.error(e);
            }
        }

        function render() {
            const container = document.getElementById('listContainer');
            const savings = parseInt(document.getElementById('userSavingsMonths').value) || 0;
            const housing = document.getElementById('userHousing').value;
            
            container.innerHTML = "";
            allData.forEach((item, index) => {
                let tag = savings < 6 ? "통장 기간 부족" : (housing === 'has' ? "유주택자 주의" : "1순위 가능");
                let tagColor = savings < 6 ? "bg-red-100 text-red-700" : (housing === 'has' ? "bg-yellow-100 text-yellow-700" : "bg-green-100 text-green-700");

                container.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <div class="flex justify-between mb-2">
                            <h2 class="font-bold text-sm">${item.houseNm || '정보없음'}</h2>
                            <span class="${tagColor} text-[10px] px-2 py-1 rounded-md font-medium">${tag}</span>
                        </div>
                        <p class="text-[11px] text-gray-500 mb-2">${item.hssplyAdres || '주소없음'}</p>
                        <div class="text-[11px] text-gray-400">모집공고일: ${item.pblancPntsnDt || '-'}</div>
                        <a href="https://www.applyhome.co.kr" target="_blank" class="block mt-4 text-center bg-blue-600 text-white py-2 rounded-lg text-xs font-bold">상세보기</a>
                    </div>
                `;
            });
        }
        fetchData();
    </script>
</body>
</html>
