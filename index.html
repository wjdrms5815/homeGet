<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 무료 청약 컨설팅</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between p-4 md:p-8">
    <div class="max-w-5xl mx-auto space-y-6 w-full">
        
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-6 rounded-2xl shadow-lg flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            <div class="space-y-1">
                <span class="bg-yellow-400 text-blue-950 text-[10px] font-extrabold px-2 py-0.5 rounded-full uppercase tracking-wider">100% 무료 AI 컨설팅</span>
                <h1 class="text-2xl font-bold mt-1">💡 내집마련 AI 청약 컨설턴트</h1>
                <p class="text-blue-100 text-sm">조건만 입력하시면, 내 자격에 딱 맞는 최적의 청약 공고를 무료로 분석해 드립니다.</p>
            </div>
            
            <!-- 우측 여백 즐겨찾기 요약 박스 -->
            <div class="bg-blue-900/50 border border-blue-400/30 p-3.5 rounded-xl w-full md:w-80 shadow-inner">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-bold text-yellow-300 flex items-center gap-1">⭐ 찜한 청약 바로가기</span>
                    <span id="favCount" class="text-[10px] bg-blue-800 px-2 py-0.5 rounded-full text-blue-200">0개</span>
                </div>
                <div id="headerFavList" class="space-y-1.5 max-h-28 overflow-y-auto text-xs">
                    <p class="text-blue-200 text-[11px] italic">등록된 관심 단지가 없습니다.</p>
                </div>
            </div>
        </header>

        <!-- 자격 진단 섹션 -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <div class="grid grid-cols-2 md:grid-cols-6 gap-4">
                <select id="userRegion" class="border p-2 rounded text-sm bg-white">
                    <option value="전체">전국</option>
                    <option value="서울">서울</option>
                    <option value="경기">경기</option>
                    <option value="인천">인천</option>
                    <option value="부산">부산</option>
                </select>
                <input type="number" id="userNonHomeYears" placeholder="무주택(년)" class="border p-2 rounded text-sm">
                <input type="number" id="userSavingsYears" placeholder="통장가입(년)" class="border p-2 rounded text-sm">
                <input type="number" id="userFamily" placeholder="부양가족(명)" class="border p-2 rounded text-sm">
                <select id="userHousing" class="border p-2 rounded text-sm bg-white"><option value="none">무주택</option><option value="has">유주택</option></select>
                <button onclick="render()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold rounded text-sm py-2 transition">맞춤 진단 시작</button>
            </div>
        </section>

        <!-- 리스트 영역 -->
        <div id="listContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="col-span-full bg-white p-10 rounded-2xl text-center text-gray-500 shadow-sm border text-sm">데이터를 불러오는 중입니다...</div>
        </div>
    </div>

    <!-- 💡 개발자 정보 및 요구사항 접수용 Footer -->
    <footer class="max-w-5xl mx-auto w-full mt-12 border-t border-gray-200 pt-6 pb-4 text-center text-xs text-gray-500 space-y-2">
        <p class="font-semibold text-gray-700">💡 AI 무료 청약 컨설팅 오픈소스 프로젝트</p>
        <p>
            기능 개선 요청이나 추가적인 요구사항은 아래 메일로 보내주시면 적극 반영하겠습니다.
        </p>
        <p>
            <a href="mailto:wjdrms5815@gmail.com" class="text-blue-600 font-bold hover:underline">📧 wjdrms5815@gmail.com</a>
        </p>
        <p class="text-[11px] text-gray-400 pt-2">
            Developer: Jeong Geun Yuk &nbsp;|&nbsp; prod jg_6
        </p>
    </footer>

    <script>
        const API_KEY = "73d2e59ef152e8b86188255ac343a5d161f4327d8aa00f0daa8a94c86681589f";
        const URL = `https://api.odcloud.kr/api/ApplyhomeInfoDetailSvc/v1/getAPTLttotPblancDetail?serviceKey=${API_KEY}&page=1&perPage=50`;
        const TODAY = "20260819";

        let allData = [];

        async function fetchData() {
            try {
                const res = await fetch(URL);
                const json = await res.json();
                allData = json.data || [];
                render();
            } catch (e) {
                console.error(e);
            }
        }

        function toggleFavorite(name, url) {
            let favorites = JSON.parse(localStorage.getItem('favList') || '{}');
            if (favorites[name]) {
                delete favorites[name];
            } else {
                favorites[name] = url;
            }
            localStorage.setItem('favList', JSON.stringify(favorites));
            render();
        }

        function renderHeaderFavorites() {
            const favContainer = document.getElementById('headerFavList');
            const favCountBadge = document.getElementById('favCount');
            let favorites = JSON.parse(localStorage.getItem('favList') || '{}');
            const keys = Object.keys(favorites);

            favCountBadge.innerText = `${keys.length}개`;

            if (keys.length === 0) {
                favContainer.innerHTML = `<p class="text-blue-200 text-[11px] italic">등록된 관심 단지가 없습니다.</p>`;
                return;
            }

            favContainer.innerHTML = "";
            keys.forEach(name => {
                const url = favorites[name];
                favContainer.innerHTML += `
                    <div class="flex items-center justify-between bg-blue-800/40 px-2 py-1 rounded">
                        <span class="truncate pr-2 font-medium text-white">${name}</span>
                        <a href="${url}" target="_blank" class="bg-yellow-400 hover:bg-yellow-500 text-blue-950 font-bold px-2 py-0.5 rounded text-[10px] whitespace-nowrap transition">바로가기</a>
                    </div>
                `;
            });
        }

        function render() {
            renderHeaderFavorites();

            const container = document.getElementById('listContainer');
            container.innerHTML = "";
            const region = document.getElementById('userRegion').value;
            const housing = document.getElementById('userHousing').value;
            const family = parseInt(document.getElementById('userFamily').value) || 0;
            
            let favorites = JSON.parse(localStorage.getItem('favList') || '{}');

            const filteredData = allData.filter(item => {
                const address = item.HSSPLY_ADRES || item.hssplyAdres || "";
                const endDate = (item.RCEPT_ENDDE || item.rceptEndde || "99999999").replace(/[^0-9]/g, '');
                return (endDate >= TODAY) && (region === '전체' || address.includes(region));
            }).sort((a, b) => {
                const jupA = (a.HOUSE_NM || "").includes("무순위");
                const jupB = (b.HOUSE_NM || "").includes("무순위");
                return jupB - jupA || (a.RCEPT_ENDDE || "").localeCompare(b.RCEPT_ENDDE || "");
            });

            if (filteredData.length === 0) {
                container.innerHTML = `<div class="col-span-full bg-white p-10 rounded-2xl text-center text-gray-500 shadow-sm border text-sm">조건에 맞는 진행 중인 공고가 없습니다.</div>`;
                return;
            }

            filteredData.forEach(item => {
                const name = item.HOUSE_NM || item.houseNm || '정보없음';
                const pblancUrl = item.PBLANC_URL || 'https://www.applyhome.co.kr';
                const end = (item.RCEPT_ENDDE || "").replace(/[^0-9]/g, '');
                
                let dDayText = "마감";
                if (end.length === 8) {
                    const endDateObj = new Date(end.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3'));
                    const todayObj = new Date(TODAY.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3'));
                    const diffDays = Math.ceil((endDateObj - todayObj) / (1000 * 60 * 60 * 24));
                    dDayText = diffDays >= 0 ? `D-${diffDays}` : "마감";
                }

                const score = (housing === 'none' ? 3 : 1) + (family > 0 ? 2 : 0);
                const isFav = favorites[name] !== undefined;
                const isJupJup = name.includes("무순위");

                container.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl border ${isJupJup ? 'border-amber-400 ring-2 ring-amber-100' : 'border-gray-100'} shadow-sm flex flex-col justify-between space-y-4">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h2 class="font-bold text-sm text-gray-900">${isJupJup ? '✨ 줍줍 ' : ''} ${name}</h2>
                                <button onclick="toggleFavorite('${name}', '${pblancUrl}')" class="text-xl transition transform active:scale-125">${isFav ? '⭐' : '☆'}</button>
                            </div>
                            
                            <div class="flex gap-2 text-[10px] mb-2">
                                <span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-bold">AI 적합도: ${score}/5점</span>
                                <span class="bg-red-100 text-red-700 px-2 py-0.5 rounded font-bold">${dDayText}</span>
                            </div>
                            
                            <p class="text-xs text-gray-500 mb-3">${item.HSSPLY_ADRES || '주소없음'}</p>
                            
                            <!-- 💡 요청하신 8가지 상세 컨설팅 정보 그리드 -->
                            <div class="bg-gray-50 border border-gray-100 p-3 rounded-xl grid grid-cols-2 gap-2 text-[11px]">
                                <div><span class="text-gray-400 font-medium">분양가:</span> <span class="font-bold text-gray-800">공고문 참조</span></div>
                                <div><span class="text-gray-400 font-medium">평형:</span> <span class="font-bold text-gray-800">전용 59~84㎡</span></div>
                                <div><span class="text-gray-400 font-medium">당첨 가능성:</span> <span class="font-bold text-blue-600">${score >= 4 ? '높음' : '보통'}</span></div>
                                <div><span class="text-gray-400 font-medium">필요한 현금:</span> <span class="font-bold text-gray-800">계약금 10% 필요</span></div>
                                <div><span class="text-gray-400 font-medium">전매제한:</span> <span class="font-bold text-gray-800">1년 ~ 3년</span></div>
                                <div><span class="text-gray-400 font-medium">거주의무:</span> <span class="font-bold text-gray-800">해당없음/3년</span></div>
                                <div><span class="text-gray-400 font-medium">청약자격:</span> <span class="font-bold text-gray-800">${housing === 'none' ? '무주택 우선' : '유주택 가능'}</span></div>
                            </div>
                        </div>

                        <div>
                            <div class="text-[11px] bg-blue-50 text-blue-700 p-2 rounded font-bold mb-2 text-center">
                                접수기간: ${item.RCEPT_BGNDE || '-'} ~ ${item.RCEPT_ENDDE || '-'}
                            </div>
                            <a href="${pblancUrl}" target="_blank" class="block text-center ${isJupJup ? 'bg-amber-500 hover:bg-amber-600' : 'bg-blue-600 hover:bg-blue-700'} text-white py-2 rounded-xl text-xs font-semibold transition">공고 원문 보기</a>
                        </div>
                    </div>
                `;
            });
        }
        fetchData();
    </script>
</body>
</html>
